name: ✨ Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful requests describe a problem rather than a solution. If I understand what
        you're trying to do, there's often a better answer than the one either of us started with.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and discussions and this isn't a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you're in when you hit this, not the feature you want.
      placeholder: |
        I want to know when the talks I care about start, but I only remember to open the app
        once in the morning, so I miss sessions that start later.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your proposed solution, if you have one. It's fine to leave this open-ended.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Including workarounds you're using today.

  - type: dropdown
    id: scope
    attributes:
      label: Who does this affect?
      options:
        - Every attendee
        - A specific group (speakers, organizers, volunteers…)
        - Mostly me / a niche case
        - Contributors and maintainers (developer experience)
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - label: I'd be willing to open a PR for this.
        - label: I've read [CONTRIBUTING.md](../blob/master/CONTRIBUTING.md) and I'm okay with the architecture rules this project follows.
